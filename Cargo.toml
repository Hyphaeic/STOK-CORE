[package]
name = "stok-core"
version = "0.1.0"
edition = "2021"
description = "State-Time Option Kernels for compositional hierarchical planning"
repository = "https://github.com/Hyphaeic/STOK-CORE/"
keywords = ["reinforcement-learning", "planning", "gpu", "stok"]
categories = ["science", "algorithms"]
# Since HPL is a custom license (not in the SPDX registry), use license-file
license-file = "LICENSE"

[dependencies]
# Burn ML framework with WGPU backend
burn = { version = "0.19", features = ["wgpu"] }

# Random number generation for sampling/testing
rand = "0.8"

[dev-dependencies]
# Floating-point comparison in tests
approx = "0.5"
# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }

[features]
default = []
# CUDA backend (requires burn-cuda)
cuda = ["burn/cuda"]
# Enable benchmarks
bench = []

[[bench]]
name = "feasibility_bench"
harness = false

[profile.release]
lto = true
codegen-units = 1

[profile.bench]
debug = true
